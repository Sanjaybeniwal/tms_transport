name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Navigate to project directory on EC2 server
            cd /var/www/tms || cd /var/www/tms_transport || cd ~/tms_transport || cd ~/tms || exit 1
            
            # Fetch latest changes from GitHub
            git pull origin main
            
            # Setup Backend
            cd backend
            npm install --production
            
            # Setup & Build Frontend
            cd ../frontend
            npm install
            npm run build
            
            # Restart Express API & PM2 Processes
            cd ../backend
            pm2 restart all || pm2 start server.js --name "tms-backend"

